[package]
name = "platform_windows"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license.workspace = true

# ROADMAP Tier 1.1. The UIA read path is real behind `#[cfg(windows)]`
# (uia_live + the host-portable uia_ids/uia_caps/uia_text); WH_KEYBOARD_LL,
# SendInput, the layered overlay, and the event subscriptions are still the
# fail-closed scaffold — those slices extend this feature list with
# "Win32_UI_Input_KeyboardAndMouse" (WH_KEYBOARD_LL, SendInput) as they land.

[dependencies]
platform = { path = "../platform" }
shell_flags = { path = "../shell_flags" }

# Phase 0.2/0.3 host services and native ShellExecuteW URL launching are real
# already. The full UIA adapter extends this target-specific feature set.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  # RtlGetVersion for environment(). It is generated into
  # `windows::Wdk::System::SystemServices` (ntdll), so the Wdk feature is what
  # makes the module exist; the function itself is additionally gated on
  # Win32_System_SystemInformation below, which supplies its OSVERSIONINFOW.
  "Wdk_System_SystemServices",
  # CoInitializeEx/CoUninitialize/CoCreateInstance and SAFEARRAY (UIA runtime
  # ids and TextPattern selections), for the UIA read path below.
  "Win32_System_Com",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  # GlobalMemoryStatusEx / MEMORYSTATUSEX for the RAM-fit probe, and
  # OSVERSIONINFOW for the RtlGetVersion probe above.
  "Win32_System_SystemInformation",
  # The UIA client surface: CUIAutomation coclass, IUIAutomation(Element),
  # TextPattern interfaces, and the UIA_* error/pattern constants.
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  # ShellExecuteW's SW_SHOWNORMAL, plus the heartbeat message pump:
  # MsgWaitForMultipleObjectsEx / PeekMessageW / TranslateMessage /
  # DispatchMessageW and their MSG, QS_ALLINPUT, MWMO_INPUTAVAILABLE and
  # PM_REMOVE constants.
  "Win32_UI_WindowsAndMessaging",
] }
