[package]
name = "platform_windows"
version.workspace = true
rust-version.workspace = true
edition = "2021"
license.workspace = true

# SCAFFOLD (ROADMAP Tier 1.1). The PlatformAdapter contract is implemented as a
# fail-closed stub on every host so `cargo build/test --workspace` stays green on
# the macOS-only dev/CI environment this was authored in. The real UI Automation
# / WH_KEYBOARD_LL / SendInput implementation lands behind `#[cfg(windows)]` on a
# Windows build+test environment — the target table below already exists for the
# Phase-0 host services; the full adapter extends its feature list with
# "Win32_UI_Accessibility" (UIA), "Win32_UI_Input_KeyboardAndMouse"
# (WH_KEYBOARD_LL, SendInput), and "Win32_UI_WindowsAndMessaging".

[dependencies]
platform = { path = "../platform" }
shell_flags = { path = "../shell_flags" }

# Phase 0.2/0.3 host services and native ShellExecuteW URL launching are real
# already. The full UIA adapter extends this target-specific feature set.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  # RtlGetVersion for environment(). It is generated into
  # `windows::Wdk::System::SystemServices` (ntdll), so the Wdk feature is what
  # makes the module exist; the function itself is additionally gated on
  # Win32_System_SystemInformation below, which supplies its OSVERSIONINFOW.
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  # GlobalMemoryStatusEx / MEMORYSTATUSEX for the RAM-fit probe, and
  # OSVERSIONINFOW for the RtlGetVersion probe above.
  "Win32_System_SystemInformation",
  "Win32_UI_Shell",
  # ShellExecuteW's SW_SHOWNORMAL, plus the heartbeat message pump:
  # MsgWaitForMultipleObjectsEx / PeekMessageW / TranslateMessage /
  # DispatchMessageW and their MSG, QS_ALLINPUT, MWMO_INPUTAVAILABLE and
  # PM_REMOVE constants.
  "Win32_UI_WindowsAndMessaging",
] }
