[package]
name = "platform_linux"
version.workspace = true
edition = "2021"
license.workspace = true

# SCAFFOLD (ROADMAP Tier 1.1) for the AT-SPI2/X11 surfaces: those are fail-closed
# stubs on every host so `cargo build/test --workspace` stays green on the macOS
# dev machines that also build this crate. The host surfaces needing no desktop
# session (version/memory probes, XDG autostart, `xdg-open`) are real and use
# only the standard library. The real AT-SPI2 / XTEST / wtype / IBus
# implementation lands behind `#[cfg(target_os = "linux")]` — its Linux-only
# dependencies go under a target table so non-Linux hosts never pull them:
#
#   [target.'cfg(target_os = "linux")'.dependencies]
#   atspi = "..."        # AT-SPI2 accessibility over D-Bus (read/insert, focus/caret events)  -- shipped
#   x11rb = "..."        # X11 override-redirect overlay window; XTEST synthetic keys          -- overlay shipped
#   # Wayland: shell out to `wtype`, or use libei, for synthetic input where
#   # XTEST is unavailable; IBus bindings for the IME commit path.

[dependencies]
platform = { path = "../platform" }
shell_flags = { path = "../shell_flags" }
# Scrubs the memory-store key's transport buffer (crates/platform_linux/src/
# memory_key.rs), matching what `memory` and `platform_macos` do with the same
# bytes. Pure Rust and already in the workspace graph, so this is not a new
# dependency for the shipped macOS artifact.
zeroize.workspace = true

# AT-SPI2 over D-Bus (ROADMAP Phase 2.1). Linux-only by target table: macOS and
# Windows builds neither fetch nor compile it, so the shipped macOS artifact is
# unaffected. `zbus` is enabled to re-export the exact zbus this atspi links, so
# the blocking connection cannot end up on a second, incompatible version.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", features = ["zbus"] }
# atspi depends on zbus with default-features = false, which drops
# `blocking-api` — and with it both `zbus::blocking` and the `...ProxyBlocking`
# types the proxy macro would generate. Cargo features are additive across the
# graph, so naming zbus here with just that feature turns it back on for atspi's
# own zbus rather than pulling in a second copy. The version must stay
# semver-compatible with atspi's `5.5` for that unification to happen.
zbus = { version = "5.5", default-features = false, features = ["blocking-api"] }
# X11 for the accept tap (ROADMAP Phase 2.3 — a passive XGrabKey in GrabModeSync
# resolved per keystroke with XAllowEvents) and the override-redirect overlay
# (Phase 2.5). One entry for both; `default-features = false` is load-bearing:
# x11rb's `allow-unsafe-code` feature is what pulls in libxcb, and a C library in
# the link line would make the compme binary refuse to *start* on a host without
# it — the same rule that ruled out libatspi above, and the reason this is not
# a plain `x11rb = "0.14"`. Only `shape` is enabled, for the overlay's empty input
# region (click-through) and the bounding region that gives transparency with no
# compositor; the tap needs core X11 only. Its whole dependency set is then
# x11rb-protocol + rustix + gethostname.
x11rb = { version = "0.14", default-features = false, features = ["shape"] }
# Glyph rasterization, pure Rust. The plan's §2.5 offered "pango or
# tiny-skia+fontdue — smallest dep wins": the overlay needs exactly a filled
# rectangle and a coverage blit, both a few lines over a Vec<u32>, so tiny-skia
# would be five more crates for a canvas we would not use, and pango means C
# libraries. fontdue brings ttf-parser + hashbrown and nothing else.
fontdue = "0.9"

# The live AT-SPI tests drive the fixture directly (seeding text, setting a
# selection) so the read path can be checked against text the test chose. That is
# test-side write access; the adapter's own insert path is Phase 2.4.
[target.'cfg(target_os = "linux")'.dev-dependencies]
atspi = { version = "0.30", features = ["zbus"] }
zbus = { version = "5.5", default-features = false, features = ["blocking-api"] }
# XTEST synthesizes the keystrokes the live accept-tap tests assert on. The X
# server cannot tell a XTEST key from a hardware one, so it exercises passive
# grabs exactly as a real keypress does. Test-only: the adapter itself never
# synthesizes keys, so the shipped binary does not carry the extension.
# default-features = false here too, or Cargo's feature unification would build
# the library under test with `allow-unsafe-code` and the tests would stop
# exercising the configuration that actually ships.
x11rb = { version = "0.14", default-features = false, features = ["xtest", "shape"] }
