name: Optional GPU builds

on:
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:
    inputs:
      backend:
        description: SDK build to verify
        type: choice
        default: all
        options:
          - all
          - vulkan-linux
          - cuda-linux
          - vulkan-windows

permissions:
  contents: read

jobs:
  vulkan-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'all' || inputs.backend == 'vulkan-linux'
    name: Linux Vulkan SDK build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: optional-gpu-vulkan-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: optional-vulkan
      - name: Install Vulkan SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libvulkan-dev glslc
      - name: Check feature isolation
        run: tools/release/check-model-client-features.sh
      - name: Build with Vulkan
        run: cargo build --locked -p app --features vulkan

  cuda-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'all' || inputs.backend == 'cuda-linux'
    name: Linux CUDA SDK build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: optional-gpu-cuda-linux
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_CUDA_ARCHITECTURES: "75"
      # The pinned llama source's CCCL iterator branch does not compile with
      # CUDA 13.4; CUDA 12.9 uses its compatible fallback implementation.
      CUDACXX: /usr/local/cuda-12.9/bin/nvcc
      CUDA_PATH: /usr/local/cuda-12.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: optional-cuda
      - name: Install CUDA SDK build dependencies
        run: |
          curl -fsSLo "$RUNNER_TEMP/cuda-keyring.deb" \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          echo "d2a6b11c096396d868758b86dab1823b25e14d70333f1dfa74da5ddaf6a06dba  $RUNNER_TEMP/cuda-keyring.deb" \
            | sha256sum --check --strict
          sudo dpkg -i "$RUNNER_TEMP/cuda-keyring.deb"
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev cuda-compiler-12-9 libcublas-dev-12-9
      - name: Build with CUDA
        run: cargo build --locked -p app --features cuda

  vulkan-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'all' || inputs.backend == 'vulkan-windows'
    name: Windows Vulkan SDK build
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: optional-gpu-vulkan-windows
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: "2"
      # Avoid the pinned llama source's CMP0147 Visual Studio custom-step race.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: optional-vulkan-windows
      - name: Install Vulkan SDK build dependencies
        shell: pwsh
        run: |
          $sdkVersion = "1.4.357.0"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "VulkanSDK\$sdkVersion"
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          $sdkUrl = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/vulkan_sdk.exe"
          $expectedSha256 = "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"

          Invoke-WebRequest -Uri $sdkUrl -OutFile $installer
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Vulkan SDK checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          $arguments = @(
            "--root"
            $sdkRoot
            "--accept-licenses"
            "--default-answer"
            "--confirm-command"
            "install"
            "copy_only=1"
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Vulkan SDK installer failed with exit code $($process.ExitCode)"
          }

          @(
            (Join-Path $sdkRoot "Include\vulkan\vulkan.h")
            (Join-Path $sdkRoot "Lib\vulkan-1.lib")
            (Join-Path $sdkRoot "Bin\glslc.exe")
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) {
              throw "Vulkan SDK is missing required file: $_"
            }
          }

          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $sdkRoot "Bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build with Vulkan
        run: cargo build --locked -p app --features vulkan
