# Action SHA bumps (github-actions ecosystem below) require two manual
# follow-ups in the same PR: re-pin tools/release/check-model-gates.sh, which
# pins the exact action SHAs, and update the `# vX.Y.Z` trailing comments on
# the `uses:` lines by hand (dependabot rewrites only the SHA).
version: 2
updates:
  # Workflow action pins (SHA-pinned; dependabot rewrites to the new SHA).
  # Monthly: every bump needs the check-model-gates.sh allowlist re-pin, so
  # weekly cadence is SHA-reconciliation churn against the pinned allowlist.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
    # One bundled PR per ecosystem keeps review noise low.
    groups:
      github-actions:
        patterns:
          - "*"
  # Cargo workspace deps. Exact-pinned deps (e.g. ed25519-dalek) still get PRs;
  # the maintainer reviews those case-by-case.
  #
  # llama-cpp-2 is ignored on purpose (2026-07-25 audit, finding F15).
  # crates/model_client declares it TWICE — once per target
  # (cfg(target_os = "macos") with "metal", cfg(not(...)) without) — both
  # exact-pinned. Dependabot rewrites only one of the two entries, leaving two
  # unsatisfiable `=` requirements, so the PR fails resolution on every lane
  # ("failed to select a version for llama-cpp-2") and, because the group
  # pattern is "*", it drags every unrelated bump down with it. ABI-sensitive
  # llama bumps are a manual, gated change anyway: edit both target entries in
  # crates/model_client/Cargo.toml AND tools/spike/Cargo.toml together, then
  # run tools/release/run-model-gates.sh before committing.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    ignore:
      - dependency-name: "llama-cpp-2"
    groups:
      cargo:
        patterns:
          - "*"
  # tools/spike is a separate locked package tree with its own Cargo.lock and
  # duplicated pins (llama-cpp-2 etc.), invisible to the root workspace entry
  # above. llama-cpp-2 is ignored here too: the two trees must move together
  # (see the root entry above), so a spike-only bump would split the pin.
  - package-ecosystem: cargo
    directory: "/tools/spike"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    ignore:
      - dependency-name: "llama-cpp-2"
    groups:
      cargo-spike:
        patterns:
          - "*"
